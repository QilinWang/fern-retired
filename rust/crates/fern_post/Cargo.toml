[package]
name = "fern_post"
version = "0.1.0"
edition = "2024"
description = "DB-independent post-processing diagnostics for Fern (normality battery, joint MVN, p-value uniformity, calibration)."
license = "MIT"

[dependencies]
ndarray = "0.17.2"
rayon = "1.11.0"
statrs = "0.18"
normality = "3.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
safetensors = "0.8.0"
