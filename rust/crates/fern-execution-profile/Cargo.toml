[package]
name = "fern-execution-profile"
version = "0.1.0"
edition = "2024"
description = "Validated operational execution profiles for Fern experiments."
publish = false

[lib]
name = "fern_execution_profile"
path = "src/lib.rs"

[dependencies]
fern-experiment-types = { path = "../fern-experiment-types" }
fern-json-contract = { path = "../fern-json-contract" }
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rustix = { version = "1", features = ["fs"] }
