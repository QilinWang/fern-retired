[package]
name = "fern-experiment-types"
version = "0.1.0"
edition = "2024"
description = "Stable, identity-bearing experiment types shared across Fern packages."
publish = false

[lib]
name = "fern_experiment_types"
path = "src/lib.rs"

[dependencies]
fern-json-contract = { path = "../fern-json-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
schemars = { version = "0.8", features = ["derive"] }
strum = { version = "0.27", features = ["derive"] }

[dev-dependencies]
jsonschema = { version = "0.49.9", default-features = false }
serde_json = "1"
