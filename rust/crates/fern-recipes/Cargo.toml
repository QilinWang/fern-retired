[package]
name = "fern-recipes"
version = "0.1.0"
edition = "2024"
description = "The registered experiment catalog: recipe families, presets, and their identity laws."
publish = false

[lib]
name = "fern_recipes"
path = "src/lib.rs"

[dependencies]
# The catalog depends on the leaf identity crate ONLY — step 1 of the
# boundary-surgery batch existed so this line is not `fern_run` (which would
# drag tokio, diesel, and rayon in for one pure enum).
fern-experiment-types = { path = "../fern-experiment-types" }
fern-json-contract = { path = "../fern-json-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
schemars = { version = "0.8", features = ["derive"] }
strum = { version = "0.27", features = ["derive"] }
