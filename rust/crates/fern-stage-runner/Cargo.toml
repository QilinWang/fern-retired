[package]
name = "fern-stage-runner"
version = "0.1.0"
edition = "2024"
description = "Unprivileged Fern Stage runner. No Registry, leases, acceptance, or GC."
license = "MIT"
publish = false

[[bin]]
name = "fern-stage-runner"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fern-artifact = { path = "../crates/fern-artifact" }
fern-experiment-types = { path = "../crates/fern-experiment-types" }
fern-json-contract = { path = "../crates/fern-json-contract" }
