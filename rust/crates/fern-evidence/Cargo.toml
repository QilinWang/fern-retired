[package]
name = "fern-evidence"
version = "0.1.0"
edition = "2024"
description = "Acceptance-policy and immutable evidence-release contracts for Fern."
publish = false

[features]
default = []
parquet = ["dep:arrow-array", "dep:arrow-schema", "dep:arrow-select", "dep:bytes", "dep:parquet"]

[lib]
name = "fern_evidence"
path = "src/lib.rs"

[dependencies]
fern-artifact = { path = "../fern-artifact" }
fern-experiment-types = { path = "../fern-experiment-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
arrow-array = { version = "56", optional = true }
arrow-schema = { version = "56", optional = true }
arrow-select = { version = "56", optional = true }
bytes = { version = "1", optional = true }
parquet = { version = "56", default-features = false, features = ["arrow", "zstd"], optional = true }
